name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & test (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore SalaryManager.slnx

      - name: Format check
        run: dotnet format SalaryManager.slnx --verify-no-changes --verbosity minimal --no-restore

      - name: Build
        run: dotnet build SalaryManager.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SalaryManager.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore
